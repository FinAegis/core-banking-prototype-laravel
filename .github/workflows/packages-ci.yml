name: Packages CI

# Tests the distributable packages (CLI, payment SDK, MCP stdio relay)
# standalone — i.e. the way a consumer installs them — so endpoint or
# dependency drift fails the PR instead of the published artifact.
#
# The three client SDKs (sdks/javascript, sdks/php, sdks/python) are tested
# too: their unit tests cover retries and the Idempotency-Key that keeps a
# retried transfer from running twice.

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'sdks/**'
      - '.github/workflows/packages-ci.yml'

permissions:
  contents: read

jobs:
  zelta-cli:
    name: zelta-cli (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: json, mbstring

      - name: Use the in-repo payment SDK (path repository)
        working-directory: packages/zelta-cli
        # CI must test against the monorepo's SDK code, not the published
        # Packagist mirror (which can lag behind main). The version pin via
        # options.versions lets the path package satisfy the ^1.0 constraint.
        run: |
          composer config repositories.payment-sdk '{"type": "path", "url": "../zelta-sdk", "options": {"versions": {"finaegis/payment-sdk": "1.0.999"}}}'

      - name: Install dependencies
        working-directory: packages/zelta-cli
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        working-directory: packages/zelta-cli
        run: vendor/bin/phpunit

      - name: Smoke-test the binary
        working-directory: packages/zelta-cli
        run: |
          php zelta list
          php zelta --version | grep -F "$(php -r "echo (require 'config/zelta.php')['version'];")"

  zelta-sdk:
    name: zelta-sdk (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: json, mbstring

      - name: Install dependencies
        working-directory: packages/zelta-sdk
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        working-directory: packages/zelta-sdk
        run: vendor/bin/pest

  mcp-stdio:
    name: finaegis-mcp-stdio (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'  # vitest 5 needs Node 22.12+
          cache: 'npm'
          cache-dependency-path: packages/finaegis-mcp-stdio/package-lock.json

      - name: Install dependencies
        working-directory: packages/finaegis-mcp-stdio
        run: npm ci

      - name: Run tests
        working-directory: packages/finaegis-mcp-stdio
        run: npm test

  sdk-javascript:
    name: sdk-javascript (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdks/javascript/package-lock.json

      - name: Install dependencies
        working-directory: sdks/javascript
        run: npm ci

      - name: Type-check
        working-directory: sdks/javascript
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: sdks/javascript
        run: npm test

  sdk-php:
    name: sdk-php (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: json, mbstring

      - name: Install dependencies
        working-directory: sdks/php
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        working-directory: sdks/php
        run: vendor/bin/phpunit

  sdk-python:
    name: sdk-python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the package and pytest
        working-directory: sdks/python
        run: pip install . pytest

      - name: Run tests
        working-directory: sdks/python
        run: python -m pytest -q tests
