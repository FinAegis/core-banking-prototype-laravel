name: Setup PHP Environment

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to setup'
        required: false
        type: string
        default: '8.3'
      extensions:
        description: 'PHP extensions to install'
        required: false
        type: string
        default: 'mbstring, dom, fileinfo, mysql, redis, opcache, pcntl, gd, imagick, bcmath, intl, zip, soap'
      tools:
        description: 'PHP tools to install'
        required: false
        type: string
        default: 'composer:v2'
      coverage:
        description: 'Enable code coverage'
        required: false
        type: boolean
        default: false

jobs:
  setup:
    name: Setup PHP ${{ inputs.php-version }}
    runs-on: ubuntu-latest
    
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.cache-key }}
      
    steps:
      - name: Generate Cache Keys
        id: cache-keys
        run: |
          echo "cache-key=php-${{ inputs.php-version }}-${{ hashFiles('**/composer.lock') }}" >> $GITHUB_OUTPUT
          
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          tools: ${{ inputs.tools }}
          coverage: ${{ inputs.coverage && 'xdebug' || 'none' }}
          ini-values: |
            memory_limit=512M
            max_execution_time=360
            opcache.enable=1
            opcache.enable_cli=1
            opcache.memory_consumption=256
            opcache.interned_strings_buffer=16
            opcache.max_accelerated_files=20000
            opcache.validate_timestamps=0
            opcache.revalidate_freq=0
            opcache.fast_shutdown=1
          
      - name: Validate PHP Installation
        run: |
          php -v
          php -m
          composer --version