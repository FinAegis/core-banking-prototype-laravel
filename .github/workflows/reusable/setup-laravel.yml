name: Setup Laravel Application

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment type (testing, production, etc.)'
        required: false
        type: string
        default: 'testing'
      cache-dependencies:
        description: 'Cache composer dependencies'
        required: false
        type: boolean
        default: true
      run-migrations:
        description: 'Run database migrations'
        required: false
        type: boolean
        default: true
      generate-key:
        description: 'Generate application key'
        required: false
        type: boolean
        default: true

jobs:
  setup:
    name: Setup Laravel Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Get Composer Cache Directory
        id: composer-cache
        if: inputs.cache-dependencies
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        
      - name: Cache Composer Dependencies
        if: inputs.cache-dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
            
      - name: Install Composer Dependencies
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
        run: |
          composer config github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction
          composer dump-autoload
          
      - name: Configure Application Environment
        run: |
          cp .env.example .env
          sed -i "s/APP_ENV=.*/APP_ENV=${{ inputs.environment }}/" .env
          sed -i "s/APP_DEBUG=.*/APP_DEBUG=false/" .env
          
      - name: Generate Application Key
        if: inputs.generate-key
        run: php artisan key:generate
        
      - name: Cache Laravel Bootstrap
        uses: actions/cache@v4
        with:
          path: bootstrap/cache
          key: ${{ runner.os }}-bootstrap-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bootstrap-
            
      - name: Run Database Migrations
        if: inputs.run-migrations
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction || true
          
      - name: Cache Laravel Routes
        run: |
          php artisan route:cache
          php artisan config:cache
          php artisan event:cache
          
      - name: Set Directory Permissions
        run: |
          chmod -R 755 storage bootstrap/cache
          chmod -R 777 storage/logs storage/framework