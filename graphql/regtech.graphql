type RegulatoryEndpoint @model(class: "App\\Domain\\RegTech\\Models\\RegulatoryEndpoint") {
    id: ID!
    uuid: String!
    name: String!
    regulator: String!
    jurisdiction: String!
    endpoint_type: String!
    base_url: String!
    api_version: String
    is_sandbox: Boolean!
    is_active: Boolean!
    rate_limit_per_minute: Int
    timeout_seconds: Int
    last_health_check: DateTime
    health_status: String
    created_at: DateTime!
    updated_at: DateTime!
}

type FilingSchedule @model(class: "App\\Domain\\RegTech\\Models\\FilingSchedule") {
    id: ID!
    uuid: String!
    name: String!
    report_type: String!
    jurisdiction: String!
    regulator: String!
    frequency: String!
    deadline_days: Int
    deadline_time: String
    next_due_date: DateTime
    last_filed_at: DateTime
    is_active: Boolean!
    auto_generate: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

type ComplianceSummary {
    jurisdiction: String!
    regulations: [String!]!
    status: String!
    last_check: DateTime
}

extend type Query @module(name: "RegTech") {
    "Get a regulator connection by ID (compliance staff only)."
    regulatoryEndpoint(id: ID! @eq): RegulatoryEndpoint
        @find
        @builder(method: "App\\GraphQL\\Builders\\StaffOnly@compliance")
        @guard(with: ["sanctum"])

    "List regulator connections (compliance staff only)."
    regulatoryEndpoints(
        page: Int @rules(apply: ["integer", "min:1"])
        first: Int @rules(apply: ["integer", "min:1", "max:100"])
        jurisdiction: String @where(operator: "=")
        is_active: Boolean @where(operator: "=")
    ): [RegulatoryEndpoint!]!
        @paginate(defaultCount: 15, model: "App\\Domain\\RegTech\\Models\\RegulatoryEndpoint")
        @builder(method: "App\\GraphQL\\Builders\\StaffOnly@compliance")
        @guard(with: ["sanctum"])

    "Get a filing schedule by ID (compliance staff only)."
    filingSchedule(id: ID! @eq): FilingSchedule
        @find
        @builder(method: "App\\GraphQL\\Builders\\StaffOnly@compliance")
        @guard(with: ["sanctum"])

    "List filing schedules (compliance staff only)."
    filingSchedules(
        page: Int @rules(apply: ["integer", "min:1"])
        first: Int @rules(apply: ["integer", "min:1", "max:100"])
        jurisdiction: String @where(operator: "=")
        is_active: Boolean @where(operator: "=")
    ): [FilingSchedule!]!
        @paginate(defaultCount: 15, model: "App\\Domain\\RegTech\\Models\\FilingSchedule")
        @builder(method: "App\\GraphQL\\Builders\\StaffOnly@compliance")
        @guard(with: ["sanctum"])

    complianceSummary(jurisdiction: String!): ComplianceSummary
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\RegTech\\ComplianceSummaryQuery")

    "Health of the active regulator connections (compliance staff only; empty for others)."
    endpointHealth: [RegulatoryEndpoint!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\RegTech\\EndpointHealthQuery")
}

input SubmitRegulatoryReportInput {
    jurisdiction: String!
    report_type: String!
    report_data: String!
}

extend type Mutation @module(name: "RegTech") {
    submitRegulatoryReport(input: SubmitRegulatoryReportInput! @spread): String!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RegTech\\SubmitRegulatoryReportMutation")

    runHealthChecks: Boolean!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RegTech\\RunHealthChecksMutation")
}
