type Partner @model(class: "App\\Domain\\FinancialInstitution\\Models\\FinancialInstitutionPartner") {
    id: ID!
    partner_code: String
    institution_name: String
    legal_name: String
    institution_type: String
    country: String
    status: String!
    tier: String
    sandbox_enabled: Boolean
    production_enabled: Boolean
    enabled_features: [String]
    risk_rating: String
    activated_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
}

input OnboardPartnerInput {
    institution_name: String!
    legal_name: String!
    institution_type: String!
    country: String!
    tier: String
}

extend type Query @module(name: "FinancialInstitution") {
    "Get a financial-institution partner by ID (operators only)."
    partner(id: ID! @eq): Partner
        @find
        @builder(method: "App\\GraphQL\\Builders\\StaffOnly@operators")
        @guard(with: ["sanctum"])

    "List financial-institution partners (operators only)."
    partners(
        page: Int @rules(apply: ["integer", "min:1"])
        first: Int @rules(apply: ["integer", "min:1", "max:100"])
        status: String @where(operator: "=")
    ): [Partner!]!
        @paginate(defaultCount: 15, model: "App\\Domain\\FinancialInstitution\\Models\\FinancialInstitutionPartner")
        @builder(method: "App\\GraphQL\\Builders\\StaffOnly@operators")
        @guard(with: ["sanctum"])
}

extend type Mutation @module(name: "FinancialInstitution") {
    onboardPartner(input: OnboardPartnerInput! @spread): Partner!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\FinancialInstitution\\OnboardPartnerMutation")
}
