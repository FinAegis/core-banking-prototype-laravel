type AssetAllocation @model(class: "App\\Domain\\Treasury\\Models\\AssetAllocation") {
    id: ID!
    portfolio_id: String
    asset_class: String!
    target_weight: Float!
    current_weight: Float!
    drift: Float!
    target_amount: Float
    current_amount: Float
    created_at: DateTime!
    updated_at: DateTime!
}

input CreatePortfolioInput {
    asset_class: String!
    target_weight: Float!
    target_amount: Float
}

input RebalancePortfolioInput {
    portfolio_id: String!
    threshold: Float
}

extend type Query @module(name: "Treasury") {
    "Get an asset allocation by ID (operators only; asset allocations have no owner link)."
    portfolio(id: ID! @eq): AssetAllocation
        @find
        @builder(method: "App\\GraphQL\\Builders\\StaffOnly@operators")
        @guard(with: ["sanctum"])

    "List asset allocations (operators only; asset allocations have no owner link)."
    portfolios(
        page: Int @rules(apply: ["integer", "min:1"])
        first: Int @rules(apply: ["integer", "min:1", "max:100"])
        asset_class: String @where(operator: "=")
        portfolio_id: String @where(operator: "=")
    ): [AssetAllocation!]!
        @paginate(defaultCount: 15, model: "App\\Domain\\Treasury\\Models\\AssetAllocation")
        @builder(method: "App\\GraphQL\\Builders\\StaffOnly@operators")
        @guard(with: ["sanctum"])
}

extend type Mutation @module(name: "Treasury") {
    "Create an asset allocation (operators only; asset allocations have no owner link)."
    createPortfolio(input: CreatePortfolioInput! @spread): AssetAllocation!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\Treasury\\CreatePortfolioMutation")

    "Rebalance an asset allocation (operators only)."
    rebalancePortfolio(input: RebalancePortfolioInput! @spread): AssetAllocation!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\Treasury\\RebalancePortfolioMutation")
}
